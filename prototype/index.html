<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galarza Ateliê · Prévia do redesenho</title>
  <style>
    :root { color-scheme: light; --paper:#f8f4ea; --ink:#262321; --lilac:#e5d9f2; --sage:#d4ddc8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font: 1rem/1.5 system-ui,sans-serif; }
    h1,h2 { font-family: Georgia,serif; font-weight:400; line-height:1; margin:0; letter-spacing:-.05em; }
    h1 { font-size:clamp(3.4rem,9vw,8.5rem); }
    h2 { font-size:clamp(2.35rem,6vw,4.8rem); }
    a { color:inherit; }
    a:focus-visible,summary:focus-visible { outline:3px solid #53406b; outline-offset:4px; }
    .wrap { width:min(100% - 2rem, 70rem); margin-inline:auto; }
    .notice { background:var(--sage); text-align:center; padding:.45rem 1rem; margin:0; font-size:.82rem; }
    header { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; min-height:4rem; }
    .brand { font-family:Georgia,serif; font-size:1.35rem; font-style:italic; text-decoration:none; }
    summary { border:1px solid; border-radius:50%; width:2.75rem; height:2.75rem; display:grid; place-items:center; cursor:pointer; font-size:1.4rem; }
    nav { position:absolute; right:0; top:3.6rem; width:13rem; background:var(--paper); border:1px solid; border-radius:1rem; padding:.4rem; box-shadow:0 8px 24px #26232122; }
    nav a { display:block; padding:.55rem .8rem; text-decoration:none; }
    nav a:hover { background:var(--lilac); border-radius:.65rem; }
    .hero { display:grid; grid-template-columns: 1fr 1fr; background:var(--lilac); border:1px solid var(--ink); border-radius:2rem 2rem 3rem 1.4rem; overflow:hidden; }
    .hero-copy { align-self:center; padding:clamp(1.25rem,5vw,4rem); background-image:radial-gradient(#53406b24 1px,transparent 1px); background-size:17px 17px; }
    .hero-copy h1::after { content:""; display:block; width:3.4rem; height:.7rem; margin:.85rem 0 0 .15rem; border-bottom:3px solid; border-radius:0 0 53% 44%; transform:rotate(-7deg); }
    .hero-copy p { margin:1rem 0 1.35rem; }
    .hero-photo { display:block; width:100%; height:100%; min-height:22rem; object-fit:cover; object-position:center 48%; }
    .actions { display:flex; align-items:center; flex-wrap:wrap; gap:.85rem 1rem; }
    .button { display:inline-flex; padding:.65rem 1.05rem; border-radius:2rem; background:var(--ink); color:var(--paper); text-decoration:none; }
    .instagram { display:inline-flex; align-items:center; gap:.48rem; padding:.55rem .85rem; border:1px solid var(--ink); border-radius:2rem; background:var(--paper); text-decoration:none; }
    .instagram-icon { position:relative; display:inline-grid; place-items:center; width:1.15rem; height:1.15rem; border:2px solid; border-radius:5px; }
    .instagram-icon::before { content:""; width:.41rem; height:.41rem; border:1.5px solid; border-radius:50%; }
    .instagram-icon::after { content:""; position:absolute; width:2px; height:2px; top:2px; right:2px; border-radius:50%; background:currentColor; }
    .section { padding-block:clamp(2.8rem,7vw,6rem); }
    .section-heading { display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:1rem; margin-bottom:1.4rem; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1.5rem; }
    figure { margin:0; padding:.45rem .45rem .75rem; border:1px solid var(--ink); border-radius:1rem 1rem 1.3rem .9rem; background:var(--lilac); }
    figure:nth-child(even) { background:var(--sage); }
    .references figure { background:var(--paper); }
    figure img { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:.68rem .68rem .86rem .55rem; }
    figcaption { margin-top:.65rem; }
    .price { display:block; font-size:.9rem; }
    .references { background:var(--sage); border-top:2px dashed var(--ink); border-radius:3.5rem 3.5rem 0 0 / 1rem 1rem 0 0; }
    footer { padding:1.2rem 0; }
    @media (max-width: 700px) {
      .hero { grid-template-columns:1fr; }
      .hero-photo { order:-1; min-height:0; height:auto; aspect-ratio:5/4; }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.25rem .8rem; }
    }
  </style>
</head>
<body>
  <p class="notice">Prévia para aprovação · preços e disponibilidade ilustrativos</p>
  <header class="wrap">
    <a class="brand" href="#inicio">Galarza Ateliê</a>
    <details>
      <summary aria-label="Menu"><span aria-hidden="true">⋯</span></summary>
      <nav aria-label="Menu principal">
        <a href="#inicio">Início</a>
        <a href="#disponiveis">Peças disponíveis</a>
        <a href="#referencias">Referências</a>
      </nav>
    </details>
  </header>
  <main>
    <section class="hero wrap" id="inicio" aria-labelledby="titulo">
      <div class="hero-copy">
        <h1 id="titulo">Galarza<br>Ateliê</h1>
        <p>Cerâmicas feitas à mão.</p>
        <div class="actions">
          <a class="button" href="https://ig.me/m/galarza.atelie">Encomendar</a>
          <a class="instagram" href="https://www.instagram.com/galarza.atelie/"><span class="instagram-icon" aria-hidden="true"></span>Instagram</a>
        </div>
      </div>
      <img class="hero-photo" src="../public/portfolio/canecas-corrente-rosa.jpeg" alt="Canecas artesanais com alças e detalhes em corrente">
    </section>
    <section class="wrap section" id="disponiveis" aria-labelledby="titulo-disponiveis">
      <div class="section-heading"><h2 id="titulo-disponiveis">Peças disponíveis</h2></div>
      <div class="grid">
        <figure><img src="../public/portfolio/caneca-coracoes.jpeg" alt="Caneca rosa com corações em relevo"><figcaption>Caneca Corações <span class="price">R$ 140</span></figcaption></figure>
        <figure><img src="../public/portfolio/copo-estrelas.jpeg" alt="Copo rosa com estrelas em relevo"><figcaption>Copo Estrelas <span class="price">R$ 125</span></figcaption></figure>
        <figure><img src="../public/portfolio/caneca-laco-azul.jpeg" alt="Caneca azul com laço em relevo"><figcaption>Caneca Laço Azul <span class="price">R$ 155</span></figcaption></figure>
      </div>
    </section>
    <section class="references section" id="referencias" aria-labelledby="titulo-referencias">
      <div class="wrap">
        <div class="section-heading">
          <h2 id="titulo-referencias">Referências</h2>
          <a href="https://ig.me/m/galarza.atelie">Conversar sobre uma encomenda</a>
        </div>
        <div class="grid">
          <figure><img src="../public/portfolio/copo-estrelas-frente.jpeg" alt="Copo de cerâmica decorado com estrelas"><figcaption>Copos</figcaption></figure>
          <figure><img src="../public/portfolio/canecas-florais.jpeg" alt="Canecas florais empilhadas"><figcaption>Xícaras e canecas</figcaption></figure>
          <figure><img src="../public/portfolio/vaso-azul.jpeg" alt="Vaso azul texturizado"><figcaption>Vasos</figcaption></figure>
        </div>
      </div>
    </section>
  </main>
  <footer class="wrap"><a href="#inicio">Galarza Ateliê</a></footer>
  <script>
    const menu = document.querySelector('details');
    menu.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => {
        const section = document.querySelector(link.hash);
        section.tabIndex = -1;
        section.focus({ preventScroll: true });
        menu.open = false;
      });
    });
    menu.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && menu.open) {
        menu.open = false;
        menu.querySelector('summary').focus();
      }
    });
  </script>
</body>
</html>
